[package]
name = "embassy-usb"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Async USB device stack for embedded devices in Rust."
keywords = ["embedded", "async", "usb", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-usb"

[features]
defmt = ["embassy-usb-upstream/defmt"]
log = ["embassy-usb-upstream/log"]
usbd-hid = ["embassy-usb-upstream/usbd-hid"]
default = ["usbd-hid"]

# BEGIN AUTOGENERATED CONFIG FEATURES
# Generated by gen_config.py. DO NOT EDIT.
max-interface-count-1 = ["embassy-usb-upstream/max-interface-count-1"]
max-interface-count-2 = ["embassy-usb-upstream/max-interface-count-2"]
max-interface-count-3 = ["embassy-usb-upstream/max-interface-count-3"]
max-interface-count-4 = ["embassy-usb-upstream/max-interface-count-4"] # Default
max-interface-count-5 = ["embassy-usb-upstream/max-interface-count-5"]
max-interface-count-6 = ["embassy-usb-upstream/max-interface-count-6"]
max-interface-count-7 = ["embassy-usb-upstream/max-interface-count-7"]
max-interface-count-8 = ["embassy-usb-upstream/max-interface-count-8"]

max-handler-count-1 = ["embassy-usb-upstream/max-handler-count-1"]
max-handler-count-2 = ["embassy-usb-upstream/max-handler-count-2"]
max-handler-count-3 = ["embassy-usb-upstream/max-handler-count-3"]
max-handler-count-4 = ["embassy-usb-upstream/max-handler-count-4"] # Default
max-handler-count-5 = ["embassy-usb-upstream/max-handler-count-5"]
max-handler-count-6 = ["embassy-usb-upstream/max-handler-count-6"]
max-handler-count-7 = ["embassy-usb-upstream/max-handler-count-7"]
max-handler-count-8 = ["embassy-usb-upstream/max-handler-count-8"]

# END AUTOGENERATED CONFIG FEATURES

[dependencies]
embassy-usb-upstream = { package = "embassy-usb", git = "https://github.com/embassy-rs/embassy", rev = "cd7570483a7036f23a9925a339152396bec4c041", default-features = false }
